name: Build NEO PLUS IOS LUANCHER APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Locate project (unzip nested zip if needed)
        run: |
          if [ -z "$(find . -name 'settings.gradle*' -not -path './.git/*' | head -n1)" ]; then
            Z=$(find . -maxdepth 2 -name '*.zip' | head -n1)
            echo "No Gradle project found; unzipping $Z"
            unzip -o -q "$Z" -d _project
          fi
          S=$(find . -name 'settings.gradle*' -not -path './.git/*' | head -n1)
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"
          echo "Project dir: $(dirname "$S")"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          APK=$(find "$PROJECT_DIR" -name 'app-debug.apk' | head -n1)
          cp "$APK" NEO-PLUS-IOS-LUANCHER.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEO-PLUS-IOS-LUANCHER
          path: NEO-PLUS-IOS-LUANCHER.apk
          if-no-files-found: error
