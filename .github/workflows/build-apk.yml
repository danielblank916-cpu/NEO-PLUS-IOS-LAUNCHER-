name: Build NEO PLUS IOS LUANCHER APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the newest project zip and unpack it
        run: |
          # 1) a project zip added or changed in the latest push, else 2) the highest version number in the repo
          ZIP=$(git diff --name-only HEAD~1 HEAD -- '*.zip' 2>/dev/null | grep -E 'LAUNCHER-v[0-9]' | sort -V | tail -1 || true)
          if [ -z "$ZIP" ]; then
            ZIP=$(ls -1 | grep -E '^NEO-PLUS-IOS-LAUNCHER-v[0-9]+_[0-9]+.*\.zip$' | sort -V | tail -1)
          fi
          echo "Building from: $ZIP"
          rm -rf build-src && mkdir build-src
          unzip -q "$ZIP" -d build-src
          DIR=$(dirname "$(find build-src -name settings.gradle.kts | head -1)")
          echo "DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project folder: $DIR"
          grep -n "versionName" "$DIR/app/build.gradle.kts"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEO-PLUS-IOS-LAUNCHER
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error